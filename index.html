
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Farmers Market Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Farmers Market Manager</h1>
    <p>Find farmers markets, vendors, and products.</p>

    <nav>
        <button onclick="showPage('markets')">Markets</button>
        <button onclick="showPage('vendors')">Vendors</button>
        <button onclick="showPage('products')">Products</button>
        <button onclick="showPage('orders')">Pre-Orders</button>
    </nav>

    <section id="markets">
        <h2>Farmers Markets</h2>
        <div id="marketList"></div>
    </section>

    <section id="vendors" style="display:none;">
        <h2>Vendors</h2>
        <div id="vendorList"></div>
    </section>

    <section id="products" style="display:none;">
        <h2>Search Products</h2>
        <input type="text" id="searchInput"
               placeholder="Search products..."
               oninput="showProducts()">
        <div id="productList"></div>
    </section>

    <section id="orders" style="display:none;">
        <h2>Place a Pre-Order</h2>

        <form onsubmit="placeOrder(event)">
            <label>Customer ID:</label>
            <input type="number" id="customerID" min="1" required>

            <label>Product:</label>
            <select id="orderProduct" required></select>

            <label>Vendor ID:</label>
            <input type="number" id="vendorID" min="1" required>

            <label>Delivery Address:</label>
            <input type="text" id="address" required>

            <button type="submit">Place Pre-Order</button>
        </form>

        <p id="orderMessage"></p>
    </section>

    <script src="script.js"></script>
</body>
</html>
